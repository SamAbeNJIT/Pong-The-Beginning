name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm test

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            harness/package-lock.json
            studio/package-lock.json
      - run: npm ci
        working-directory: harness
      - run: npx playwright-core install --with-deps chromium
        working-directory: harness
      # Skip the postinstall (it installs the harness, done above) but fetch Electron itself.
      - run: npm ci --ignore-scripts && node node_modules/electron/install.js
        working-directory: studio
      - run: npm test
        working-directory: studio
      # The real app under a virtual display: library, play window, and a full mock build.
      - run: xvfb-run -a npm run e2e
        working-directory: studio
